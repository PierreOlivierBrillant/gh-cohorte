# Vérifie la compilation et les tests sur les trois systèmes visés.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Analyse statique
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Tests avec détection des courses de données
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
